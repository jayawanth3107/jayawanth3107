<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Jayawanth — Software builder</title>
<desc id="desc">An animated 3D-inspired developer scene with floating glass cubes, orbital rings, luminous network traces and a perspective grid.</desc>
<defs>
 <linearGradient id="sceneBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFF"/><stop offset=".55" stop-color="#E8F0FF"/><stop offset="1" stop-color="#F7FAFF"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#087FA7"/><stop offset=".48" stop-color="#5367E8"/><stop offset="1" stop-color="#8452C8"/><animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/></linearGradient>
 <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BDEFFF" stop-opacity=".96"/><stop offset="1" stop-color="#5367E8" stop-opacity=".72"/></linearGradient>
 <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5367E8" stop-opacity=".88"/><stop offset="1" stop-color="#CBD5FF" stop-opacity=".95"/></linearGradient>
 <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8452C8" stop-opacity=".95"/><stop offset="1" stop-color="#D9CEFF" stop-opacity=".9"/></linearGradient>
 <radialGradient id="coreGlow"><stop offset="0" stop-color="#087FA7" stop-opacity=".55"/><stop offset=".48" stop-color="#5367E8" stop-opacity=".18"/><stop offset="1" stop-color="#8452C8" stop-opacity="0"/></radialGradient>
 <radialGradient id="ambient"><stop offset="0" stop-color="#5367E8" stop-opacity=".15"/><stop offset="1" stop-color="#5367E8" stop-opacity="0"/></radialGradient>
 <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="13" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="drop" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#7186A8" flood-opacity=".2"/></filter>
 <pattern id="microGrid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#D6E1F1" stroke-width="1" opacity=".32"/></pattern>
 <style>
 .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
 .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
 .floatA{animation:floatA 6s ease-in-out infinite}.floatB{animation:floatB 8s ease-in-out infinite}.blink{animation:blink 2.2s ease-in-out infinite}
 @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
 @keyframes floatB{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}
 @keyframes blink{0%,100%{opacity:.38}50%{opacity:1}}
 </style>
</defs>
<rect width="1280" height="560" rx="30" fill="url(#sceneBg)"/><rect width="1280" height="560" rx="30" fill="url(#microGrid)" opacity=".5"/>
<circle cx="970" cy="268" r="370" fill="url(#ambient)"/><circle cx="119" cy="40" r="260" fill="url(#ambient)"/>
<rect x="20" y="20" width="1240" height="520" rx="24" fill="none" stroke="#D6E1F1" stroke-opacity=".85"/>
<!-- Perspective grid floor -->
<g opacity=".38" stroke="#087FA7" fill="none">
 <path d="M660 430H1280M700 454H1280M748 480H1280M810 506H1280" stroke-width="1"/>
 <path d="M790 390L650 560M860 390L790 560M930 390V560M1000 390L1070 560M1070 390L1210 560M1140 390L1350 560" stroke-width="1"/>
</g>
<path d="M660 430H1280" stroke="url(#neon)" stroke-width="2" opacity=".65" filter="url(#smallGlow)"/>
<!-- Identity -->
<g transform="translate(72 74)"><rect width="232" height="36" rx="18" fill="#F2F6FF" stroke="#D6E1F1"/><circle cx="19" cy="18" r="5" fill="#0A9F83"><animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite"/></circle><text x="34" y="23" class="mono" font-size="12" letter-spacing="2" fill="#61728D">BUILD / LEARN / SHIP</text></g>
<g class="sans" fill="#13213B">
 <text x="72" y="183" font-size="20" font-weight="650" letter-spacing="5" fill="#61728D">HELLO, I'M</text>
 <text x="65" y="267" font-size="82" font-weight="850" letter-spacing="-4">JAYAWANTH<tspan fill="#087FA7">.</tspan></text>
 <rect x="74" y="291" width="116" height="5" rx="2.5" fill="url(#neon)"/>
 <text x="72" y="348" font-size="29" font-weight="650">I build for the real world.</text>
 <text x="72" y="386" font-size="23" fill="#61728D">Web engineering · Networking · Applied AI</text>
 <text x="72" y="449" font-size="16" fill="#61728D">Diploma in Computer Networking / Coimbatore, India</text>
</g>
<g transform="translate(72 478)" class="mono" font-size="11" letter-spacing="1.4"><rect width="410" height="32" rx="9" fill="#FFFFFF" stroke="#D6E1F1"/><circle cx="18" cy="16" r="4" fill="#0A9F83" class="blink"/><text x="32" y="20" fill="#61728D">STATUS:</text><text x="100" y="20" fill="#0A9F83">ALWAYS BUILDING</text><path d="M260 9V23" stroke="#D6E1F1"/><text x="278" y="20" fill="#61728D">2025 — 2027</text></g>
<!-- Holographic 3D scene -->
<circle cx="938" cy="262" r="228" fill="url(#coreGlow)" opacity=".75"><animate attributeName="opacity" values=".48;.9;.48" dur="6s" repeatCount="indefinite"/></circle>
<g transform="translate(938 258)" fill="none">
 <ellipse rx="205" ry="82" transform="rotate(-23)" stroke="#087FA7" stroke-opacity=".46" stroke-width="1.7"/>
 <ellipse rx="174" ry="112" transform="rotate(57)" stroke="#5367E8" stroke-opacity=".43" stroke-width="1.5" stroke-dasharray="5 9"/>
 <ellipse rx="224" ry="62" transform="rotate(17)" stroke="#8452C8" stroke-opacity=".5" stroke-width="1.8"/>
 <g transform="rotate(-23)"><circle cx="205" cy="0" r="7" fill="#087FA7" stroke="#F7FAFF" stroke-width="2" filter="url(#smallGlow)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></circle></g>
 <g transform="rotate(57)"><circle cx="174" cy="0" r="5.5" fill="#5367E8" filter="url(#smallGlow)"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="23s" repeatCount="indefinite"/></circle></g>
 <g transform="rotate(17)"><circle cx="224" cy="0" r="5" fill="#8452C8" filter="url(#smallGlow)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="29s" repeatCount="indefinite"/></circle></g>
</g>
<!-- Main isometric glass cube -->
<g filter="url(#drop)"><animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6s" repeatCount="indefinite"/><g transform="translate(938 251)">
 <path d="M0 -112L112 -56L0 0L-112 -56Z" fill="url(#cubeTop)" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="2"/>
 <path d="M-112 -56L0 0V128L-112 72Z" fill="url(#cubeLeft)" stroke="#A8C1FF" stroke-opacity=".78" stroke-width="2"/>
 <path d="M0 0L112 -56V72L0 128Z" fill="url(#cubeRight)" stroke="#D4B7FF" stroke-opacity=".8" stroke-width="2"/>
 <path d="M0 -112V0M-112 -56L0 0L112 -56M0 0V128" fill="none" stroke="#FFFFFF" stroke-opacity=".52" stroke-width="1.5"/>
 <path d="M-78 -57L0 -96L78 -57L0 -18Z" fill="none" stroke="#FFFFFF" stroke-opacity=".52" stroke-width="1.3"/>
 <path d="M-78 -34V50L0 90L78 50V-34" fill="none" stroke="#FFFFFF" stroke-opacity=".26" stroke-width="1.2"/>
 <path d="M-47 -43L0 -67L47 -43L0 -18Z" fill="#FFFFFF" fill-opacity=".25" stroke="#FFFFFF" stroke-opacity=".55"/>
 <path d="M-46 11L0 34L46 11M-46 36L0 59L46 36" stroke="#FFFFFF" stroke-opacity=".36" stroke-width="2" fill="none"/>
 <circle cx="0" cy="-40" r="14" fill="#087FA7" opacity=".9" filter="url(#smallGlow)"><animate attributeName="r" values="11;16;11" dur="3.5s" repeatCount="indefinite"/></circle><circle cx="0" cy="-40" r="5" fill="#FFFFFF"/>
</g></g>
<!-- Mini cubes -->
<g class="floatB" filter="url(#drop)"><g transform="translate(756 211) scale(.43)"><path d="M0 -70L70 -35L0 0L-70 -35Z" fill="url(#cubeTop)" stroke="#FFFFFF" stroke-opacity=".8"/><path d="M-70 -35L0 0V80L-70 45Z" fill="url(#cubeLeft)" stroke="#FFFFFF" stroke-opacity=".65"/><path d="M0 0L70 -35V45L0 80Z" fill="url(#cubeRight)" stroke="#FFFFFF" stroke-opacity=".7"/></g></g>
<g class="floatA" filter="url(#drop)"><g transform="translate(1126 352) scale(.32)"><path d="M0 -70L70 -35L0 0L-70 -35Z" fill="url(#cubeTop)" stroke="#FFFFFF" stroke-opacity=".8"/><path d="M-70 -35L0 0V80L-70 45Z" fill="url(#cubeLeft)" stroke="#FFFFFF" stroke-opacity=".65"/><path d="M0 0L70 -35V45L0 80Z" fill="url(#cubeRight)" stroke="#FFFFFF" stroke-opacity=".7"/></g></g>
<!-- Floating glass labels -->
<g class="floatB"><rect x="702" y="123" width="142" height="44" rx="12" fill="#FFFFFF" fill-opacity=".91" stroke="#D6E1F1" filter="url(#drop)"/><circle cx="720" cy="145" r="4" fill="#0A9F83"/><text x="733" y="149" class="mono" font-size="11" fill="#13213B">NEXT.JS</text></g>
<g class="floatA"><rect x="1082" y="156" width="128" height="44" rx="12" fill="#FFFFFF" fill-opacity=".91" stroke="#D6E1F1" filter="url(#drop)"/><circle cx="1100" cy="178" r="4" fill="#5367E8"/><text x="1113" y="182" class="mono" font-size="11" fill="#13213B">NETWORKS</text></g>
<g class="floatB"><rect x="1040" y="430" width="150" height="44" rx="12" fill="#FFFFFF" fill-opacity=".91" stroke="#D6E1F1" filter="url(#drop)"/><circle cx="1058" cy="452" r="4" fill="#8452C8"/><text x="1071" y="456" class="mono" font-size="11" fill="#13213B">APPLIED AI</text></g>
<!-- Holographic network paths -->
<g fill="none" stroke="url(#neon)" stroke-width="2" opacity=".65"><path d="M805 330L748 371L748 404"/><path d="M1064 275L1165 275L1191 301"/><path d="M874 142V105L901 88"/></g>
<g fill="#087FA7" filter="url(#smallGlow)"><circle cx="748" cy="404" r="3"/><circle cx="1191" cy="301" r="3"/><circle cx="901" cy="88" r="3"/></g>
<!-- Scanning light -->
<rect x="30" y="30" width="1220" height="2" fill="url(#neon)" opacity=".25"><animate attributeName="y" values="30;528;30" dur="16s" repeatCount="indefinite"/></rect>
<g fill="#087FA7" opacity=".75"><circle cx="670" cy="84" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle><circle cx="1195" cy="220" r="2"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle><circle cx="688" cy="380" r="2"><animate attributeName="opacity" values=".3;1;.3" dur="5s" repeatCount="indefinite"/></circle></g>
</svg>
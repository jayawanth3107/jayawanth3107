<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Jayawanth — Developer portfolio</title>
<desc id="desc">A modern developer banner for Jayawanth, a computer networking diploma student who builds web projects and explores software systems.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7FAFF"/><stop offset="1" stop-color="#EAF2FF"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5368E8"/><stop offset=".55" stop-color="#0E9F91"/><stop offset="1" stop-color="#9A55D4"/>
    <animate attributeName="x1" values="0;1;0" dur="9s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#0E9F91" stop-opacity=".18"/><stop offset="1" stop-color="#0E9F91" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#DCE6F3" stroke-width="1" opacity=".42"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#8AA0C0" flood-opacity=".14"/>
  </filter>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px}
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
    .float{animation:float 5s ease-in-out infinite}
    .pulse{animation:pulse 3.2s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  </style>
</defs>
<rect width="1200" height="500" rx="28" fill="url(#background)"/>
<rect width="1200" height="500" rx="28" fill="url(#grid)"/>
<circle cx="1020" cy="110" r="260" fill="url(#glow)"/>
<circle cx="110" cy="460" r="220" fill="url(#glow)"/>
<rect x="26" y="26" width="1148" height="448" rx="22" fill="none" stroke="#DCE6F3" stroke-width="1.5"/>
<g transform="translate(72 68)">
  <rect width="238" height="38" rx="19" fill="#E4ECFA" stroke="#DCE6F3"/>
  <circle cx="20" cy="19" r="5" fill="#0E9F91"><animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite"/></circle>
  <text x="36" y="24" class="mono" font-size="12" fill="#53657F">DEVELOPER PORTFOLIO</text>
</g>
<g class="sans" fill="#14223A">
  <text x="72" y="186" font-size="22" font-weight="600" fill="#53657F">HELLO, I'M</text>
  <text x="68" y="268" font-size="76" font-weight="800" letter-spacing="-3">JAYAWANTH<tspan fill="#0E9F91">.</tspan></text>
  <rect x="74" y="294" width="78" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="346" font-size="25" font-weight="600">Building web experiences.</text>
  <text x="72" y="382" font-size="25" font-weight="600" fill="#53657F">Learning the systems behind them.</text>
  <text x="72" y="432" font-size="16" fill="#53657F">Diploma in Computer Networking · Coimbatore, India</text>
</g>
<g transform="translate(790 94)" filter="url(#shadow)">
  <rect width="320" height="310" rx="24" fill="#FFFFFF" stroke="#DCE6F3" stroke-width="1.5"/>
  <g transform="translate(24 22)">
    <circle cx="7" cy="7" r="4" fill="#F87171"/><circle cx="22" cy="7" r="4" fill="#FBBF24"/><circle cx="37" cy="7" r="4" fill="#34D399"/>
    <text x="270" y="12" text-anchor="end" class="mono" font-size="10" fill="#53657F">JAYAWANTH.DEV</text>
  </g>
  <path d="M24 58H296" stroke="#DCE6F3"/>
  <g class="mono" font-size="15">
    <text x="28" y="98" fill="#53657F">// focus areas</text>
    <text x="28" y="139" fill="#0E9F91">01</text><text x="67" y="139" fill="#14223A">Web development</text>
    <text x="28" y="180" fill="#5368E8">02</text><text x="67" y="180" fill="#14223A">Networking</text>
    <text x="28" y="221" fill="#9A55D4">03</text><text x="67" y="221" fill="#14223A">Applied AI projects</text>
    <text x="28" y="270" fill="#53657F">const mindset = "keep building";</text>
  </g>
  <rect x="24" y="283" width="272" height="4" rx="2" fill="#DCE6F3"/>
  <rect x="24" y="283" width="190" height="4" rx="2" fill="url(#accent)" class="pulse"/>
</g>
<g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".8">
  <path d="M706 142L752 142L780 114"/><path d="M704 363L752 363L782 393"/>
  <circle cx="706" cy="142" r="5" fill="#0E9F91"/><circle cx="704" cy="363" r="5" fill="#5368E8"/>
</g>
<g class="float">
  <rect x="670" y="215" width="82" height="48" rx="12" fill="#FFFFFF" stroke="#DCE6F3"/>
  <text x="711" y="245" text-anchor="middle" class="mono" font-size="15" fill="#0E9F91">&lt;/&gt;</text>
</g>
<g class="pulse" fill="#0E9F91">
  <circle cx="1120" cy="72" r="3"/><circle cx="1138" cy="92" r="2"/><circle cx="1098" cy="92" r="2"/>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">J. Jayawanth — Full-stack developer, UI/UX designer and AI enthusiast</title>
<desc id="desc">Animated portfolio hero with a luminous 3D geometric core, orbiting technology markers and a clean editorial introduction.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5F8FC"/><stop offset="1" stop-color="#EAF1F8"/></linearGradient>
  <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#087E78"/><stop offset=".52" stop-color="#167DB1"/><stop offset="1" stop-color="#7655C7"/></linearGradient>
  <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#167DB1" stop-opacity=".78"/><stop offset="1" stop-color="#087E78" stop-opacity=".25"/></linearGradient>
  <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#087E78" stop-opacity=".72"/><stop offset="1" stop-color="#167DB1" stop-opacity=".18"/></linearGradient>
  <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7655C7" stop-opacity=".7"/><stop offset="1" stop-color="#167DB1" stop-opacity=".2"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#50BFB7" stop-opacity=".3"/><stop offset=".65" stop-color="#167DB1" stop-opacity=".08"/><stop offset="1" stop-color="#167DB1" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#CBD8E6" stroke-width="1" opacity=".5"/></pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect x="8" y="8" width="1184" height="404" rx="26"/></clipPath>
</defs>
<g clip-path="url(#clip)" font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect x="8" y="8" width="1184" height="404" rx="26" fill="url(#background)"/>
  <rect x="8" y="8" width="1184" height="404" fill="url(#grid)" opacity=".72"/>
  <ellipse cx="920" cy="207" rx="300" ry="250" fill="url(#halo)"/>
  <path d="M0 352C220 300 365 425 600 360S1000 270 1240 340" fill="none" stroke="#9CB3CA" stroke-width="1" opacity=".16"/>
  <path d="M690 0L1085 420" stroke="#9CB3CA" stroke-width="1" opacity=".12"/>
  <path d="M0 65H1200" stroke="#9CB3CA" stroke-width="1" opacity=".14"/>
  <rect x="58" y="48" width="42" height="4" rx="2" fill="url(#accentLine)"/>
  <text x="114" y="55" font-size="12" font-weight="700" letter-spacing="2.1" fill="#526780">PERSONAL PORTFOLIO  /  SOFTWARE + DESIGN</text>
  <text x="58" y="137" font-size="55" font-weight="760" letter-spacing="-2.5" fill="#15243A">J. JAYAWANTH</text>
  <text x="62" y="180" font-size="18" font-weight="720" letter-spacing="1.7" fill="#087E78">FULL-STACK DEVELOPER</text>
  <text x="62" y="211" font-size="17" font-weight="650" letter-spacing="1.1" fill="#15243A">UI/UX DESIGNER  <tspan fill="#526780">/</tspan>  AI ENTHUSIAST</text>
  <text x="62" y="254" font-size="16" fill="#526780">I turn product ideas into thoughtful interfaces</text>
  <text x="62" y="278" font-size="16" fill="#526780">and useful, well-structured software.</text>
  <g transform="translate(62 316)">
    <rect width="134" height="34" rx="17" fill="#FFFFFF" stroke="#9CB3CA" stroke-opacity=".42"/><circle cx="18" cy="17" r="4" fill="#087E78"/><text x="31" y="22" font-size="11" font-weight="750" letter-spacing="1.2" fill="#243B56">ENGINEERING</text>
    <rect x="145" width="145" height="34" rx="17" fill="#FFFFFF" stroke="#9CB3CA" stroke-opacity=".42"/><circle cx="163" cy="17" r="4" fill="#167DB1"/><text x="176" y="22" font-size="11" font-weight="750" letter-spacing="1.2" fill="#243B56">INTERFACE CRAFT</text>
    <rect x="301" width="116" height="34" rx="17" fill="#FFFFFF" stroke="#9CB3CA" stroke-opacity=".42"/><circle cx="319" cy="17" r="4" fill="#7655C7"/><text x="332" y="22" font-size="11" font-weight="750" letter-spacing="1.2" fill="#243B56">APPLIED AI</text>
  </g>
  <path d="M58 376H532" stroke="#9CB3CA" stroke-opacity=".36"/>
  <text x="60" y="397" font-size="10" font-weight="700" letter-spacing="1.8" fill="#526780">COIMBATORE, INDIA</text>
  <text x="532" y="397" text-anchor="end" font-size="10" font-weight="700" letter-spacing="1.8" fill="#526780">BUILD  /  DESIGN  /  EXPLORE</text>
  <g transform="translate(900 208)">
    <circle r="150" fill="url(#halo)" opacity=".9"/>
    <g fill="none" stroke="#167DB1" stroke-width="1.4" opacity=".48">
      <ellipse rx="198" ry="82" transform="rotate(-26)"/>
      <ellipse rx="178" ry="70" transform="rotate(42)" stroke="#7655C7" stroke-opacity=".5"/>
      <ellipse rx="146" ry="146" stroke-dasharray="3 12" opacity=".58"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/></ellipse>
    </g>
    <g fill="none" stroke="url(#accentLine)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="10 19" opacity=".9">
      <ellipse rx="198" ry="82" transform="rotate(-26)"><animate attributeName="stroke-dashoffset" values="0;-220" dur="18s" repeatCount="indefinite"/></ellipse>
    </g>
    <g>
      <circle cx="-169" cy="-75" r="5" fill="#087E78" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="162" cy="83" r="5" fill="#7655C7" filter="url(#glow)"><animate attributeName="r" values="5;8;5" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="50" cy="-151" r="4" fill="#167DB1"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/></circle>
    </g>
    <g><animateTransform attributeName="transform" type="translate" values="0 2;0 -9;0 2" dur="6s" repeatCount="indefinite"/>
      <polygon points="0,-93 76,-49 0,-5 -76,-49" fill="url(#cubeTop)" stroke="#167DB1" stroke-width="1.7"/>
      <polygon points="-76,-49 0,-5 0,83 -76,39" fill="url(#cubeLeft)" stroke="#087E78" stroke-width="1.7"/>
      <polygon points="0,-5 76,-49 76,39 0,83" fill="url(#cubeRight)" stroke="#7655C7" stroke-width="1.7"/>
      <path d="M0 -93V-5M-76 -49L0 -5L76 -49M0 -5V83" fill="none" stroke="#243B56" stroke-opacity=".64" stroke-width="1.1"/>
      <path d="M-52 -49L0 -19L52 -49M-52 -18L0 12L52 -18M-52 13L0 43L52 13" fill="none" stroke="#243B56" stroke-opacity=".18" stroke-width="1"/>
      <circle cx="0" cy="-5" r="5" fill="#15243A" opacity=".88"/>
    </g>
    <g font-size="10" font-weight="760" letter-spacing="1.4">
      <rect x="-202" y="-130" width="86" height="28" rx="14" fill="#FFFFFF" stroke="#9CB3CA" stroke-opacity=".54"/><text x="-159" y="-112" text-anchor="middle" fill="#243B56">NEXT.JS</text>
      <rect x="110" y="-133" width="92" height="28" rx="14" fill="#FFFFFF" stroke="#9CB3CA" stroke-opacity=".54"/><text x="156" y="-115" text-anchor="middle" fill="#243B56">FLUTTER</text>
      <rect x="126" y="127" width="82" height="28" rx="14" fill="#FFFFFF" stroke="#9CB3CA" stroke-opacity=".54"/><text x="167" y="145" text-anchor="middle" fill="#243B56">AI / ML</text>
      <rect x="-208" y="103" width="83" height="28" rx="14" fill="#FFFFFF" stroke="#9CB3CA" stroke-opacity=".54"/><text x="-166" y="121" text-anchor="middle" fill="#243B56">PRODUCT</text>
    </g>
    <circle r="4" fill="#087E78"><animate attributeName="opacity" values=".4;1;.4" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="8" y="8" width="1184" height="404" rx="26" fill="none" stroke="#9CB3CA" stroke-opacity=".42"/>
  <rect x="-260" y="8" width="110" height="404" fill="url(#accentLine)" opacity=".1"><animate attributeName="x" values="-260;1300" dur="12s" repeatCount="indefinite"/></rect>
</g>
</svg>